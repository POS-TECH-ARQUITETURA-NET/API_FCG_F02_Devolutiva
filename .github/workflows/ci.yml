name: CI - Integração Contínua

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release
  TEST_RESULTS_PATH: './TestResults'

jobs:
  build-and-test:
    runs-on: windows-latest
    name: Build e Testes

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔧 Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restaurar dependências
        shell: pwsh
        run: dotnet restore API_FCG_F01/API_FCG_F01.sln

      - name: 🔨 Compilar solução
        shell: pwsh
        run: dotnet build API_FCG_F01/API_FCG_F01.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: ✅ Executar testes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.TEST_RESULTS_PATH }} | Out-Null
          dotnet test API_FCG_F01/API_FCG_F01.Tests/API_FCG_F01.Tests.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --no-build `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory ${{ env.TEST_RESULTS_PATH }} `
            --verbosity normal

      - name: 📊 Publicar resultados de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_PATH }}
          if-no-files-found: warn

      - name: 🏗️ Publicar artefato de build
        shell: pwsh
        run: |
          dotnet publish API_FCG_F01/API_FCG_F01.API/API_FCG_F01.API.csproj `
            -c ${{ env.CONFIGURATION }} `
            -o ./publish

      - name: 📤 Upload do artefato para CD
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ./publish
          retention-days: 5
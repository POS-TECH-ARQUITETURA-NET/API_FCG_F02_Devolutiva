name: CD - Entrega Contínua

on:
  workflow_run:
    workflows: ["CI - Integração Contínua"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

env:
  IIS_SITE_NAME: 'API_FCG_F01'
  IIS_APP_POOL: 'API_FCG_F01_AppPool'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\API_FCG_F01'
  APP_URL: 'http://localhost:5095/swagger'
  APPCMD: 'C:\Windows\System32\inetsrv\appcmd.exe'

jobs:
  deploy-to-iis:
    runs-on: [self-hosted, windows]
    name: Deploy no IIS

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Download do artefato de build
        uses: actions/download-artifact@v4
        with:
          name: api-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          path: ./build-output

      - name: 🔍 Verificar se artefato foi baixado
        shell: cmd
        run: |
          if exist ".\build-output" (
              echo ✅ Artefato encontrado
              dir ".\build-output"
          ) else (
              echo ❌ Artefato NÃO encontrado!
              exit /b 1
          )

      - name: 🔧 Criar diretório de deploy
        shell: cmd
        run: |
          if not exist "%DEPLOY_PATH%" (
              mkdir "%DEPLOY_PATH%"
              echo ✅ Diretório criado: %DEPLOY_PATH%
          ) else (
              echo ✅ Diretório já existe: %DEPLOY_PATH%
          )

      - name: 🔧 Garantir App Pool no IIS
        shell: cmd
        run: |
          echo Verificando App Pool...
          %APPCMD% list apppool "%IIS_APP_POOL%" >nul 2>&1
          if %ERRORLEVEL% neq 0 (
              echo Criando App Pool...
              %APPCMD% add apppool /name:"%IIS_APP_POOL%"
              echo ✅ App Pool criado: %IIS_APP_POOL%
          ) else (
              echo ✅ App Pool já existe: %IIS_APP_POOL%
          )

      - name: 🔧 Garantir Site no IIS
        shell: cmd
        run: |
          echo Verificando Website...
          %APPCMD% list site "%IIS_SITE_NAME%" >nul 2>&1
          if %ERRORLEVEL% neq 0 (
              echo Criando Website...
              %APPCMD% add site /name:"%IIS_SITE_NAME%" /physicalPath:"%DEPLOY_PATH%" /bindings:http/*:5095:
              %APPCMD% set site "%IIS_SITE_NAME%" /[path='/'].applicationPool:"%IIS_APP_POOL%"
              echo ✅ Website criado: %IIS_SITE_NAME%
          ) else (
              echo ✅ Website já existe: %IIS_SITE_NAME%
              %APPCMD% set site "%IIS_SITE_NAME%" /physicalPath:"%DEPLOY_PATH%"
          )

      - name: 🛑 Parar Application Pool no IIS
        shell: cmd
        run: |
          echo Parando App Pool...
          %APPCMD% stop apppool "%IIS_APP_POOL%"
          echo ✅ App Pool parado
          timeout /t 3 /nobreak

      - name: 🗑️ Limpar diretório de deploy
        shell: cmd
        run: |
          echo Limpando diretório de deploy...
          if exist "%DEPLOY_PATH%" (
              for /d %%x in ("%DEPLOY_PATH%\*") do @rd /s /q "%%x" 2>nul
              for %%x in ("%DEPLOY_PATH%\*") do @del /q "%%x" 2>nul
              echo ✅ Diretório limpo
          )

      - name: 📤 Copiar arquivos para IIS
        shell: cmd
        run: |
          echo Copiando arquivos para IIS...
          xcopy ".\build-output\*" "%DEPLOY_PATH%" /E /Y /I
          if %ERRORLEVEL% equ 0 (
              echo ✅ Arquivos copiados com sucesso
          ) else (
              echo ❌ Erro ao copiar arquivos
              exit /b 1
          )

      - name: ✅ Iniciar Application Pool e Site no IIS
        shell: cmd
        run: |
          echo Iniciando App Pool...
          %APPCMD% start apppool "%IIS_APP_POOL%"
          echo ✅ App Pool iniciado
          
          echo Iniciando Website...
          %APPCMD% start site "%IIS_SITE_NAME%"
          echo ✅ Website iniciado
          
          timeout /t 5 /nobreak

      - name: 🔍 Verificar saúde da aplicação
        shell: pwsh
        run: |
          $maxAttempts = 12
          $attempt = 0
          $success = $false
          
          Write-Host "Aguardando aplicação inicializar..."
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri "${{ env.APP_URL }}" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Aplicação respondendo corretamente!"
                $success = $true
                break
              }
            } catch {
              $attempt++
              Write-Host "⏳ Tentativa $attempt/$maxAttempts - Aguardando 5 segundos..."
              Start-Sleep -Seconds 5
            }
          }
          
          if (-not $success) {
            Write-Host "❌ Aplicação não respondeu após $maxAttempts tentativas"
            exit 1
          }

      - name: 💬 Notificar sucesso
        if: success()
        shell: cmd
        run: |
          echo.
          echo ✅ Deploy realizado com sucesso!
          echo 🌐 Aplicação disponível em: ${{ env.APP_URL }}
          echo.

      - name: 💬 Notificar falha
        if: failure()
        shell: cmd
        run: |
          echo.
          echo ❌ Falha no deploy - Verifique os logs acima
          echo.
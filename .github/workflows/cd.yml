name: CD - Entrega Contínua

on:
  workflow_run:
    workflows: ["CI - Integração Contínua"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

env:
  IIS_SITE_NAME: 'API_FCG_F01'
  IIS_APP_POOL: 'API_FCG_F01_AppPool'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\API_FCG_F01'
  APP_URL: 'http://localhost:5095/swagger'

jobs:
  deploy-to-iis:
    runs-on: [self-hosted, windows]
    name: Deploy no IIS

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Download do artefato de build
        uses: actions/download-artifact@v4
        with:
          name: api-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          path: ./build-output

      - name: 🔍 Verificar se artefato foi baixado
        shell: powershell
        run: |
          if (Test-Path ".\build-output") {
              Write-Host "✅ Artefato encontrado"
              Get-ChildItem ".\build-output" -Recurse | Select-Object -First 10
          } else {
              Write-Host "❌ Artefato NÃO encontrado!"
              exit 1
          }

      - name: 🔧 Criar diretório de deploy
        shell: powershell
        run: |
          $deployPath = "${{ env.DEPLOY_PATH }}"
          if (-not (Test-Path $deployPath)) {
              New-Item -ItemType Directory -Path $deployPath -Force | Out-Null
              Write-Host "✅ Diretório criado: $deployPath"
          } else {
              Write-Host "✅ Diretório já existe: $deployPath"
          }

      - name: 🔧 Garantir App Pool no IIS
        shell: cmd
        run: |
          @echo off
          echo Verificando App Pool...
          "C:\Windows\System32\inetsrv\appcmd.exe" list apppool "${{ env.IIS_APP_POOL }}"
          if %ERRORLEVEL% neq 0 (
              echo Criando App Pool...
              "C:\Windows\System32\inetsrv\appcmd.exe" add apppool /name:"${{ env.IIS_APP_POOL }}"
              echo ✅ App Pool criado: ${{ env.IIS_APP_POOL }}
          ) else (
              echo ✅ App Pool já existe: ${{ env.IIS_APP_POOL }}
          )

      - name: 🔧 Garantir Site no IIS
        shell: cmd
        run: |
          @echo off
          echo Verificando Website...
          "C:\Windows\System32\inetsrv\appcmd.exe" list site "${{ env.IIS_SITE_NAME }}"
          if %ERRORLEVEL% neq 0 (
              echo Criando Website...
              "C:\Windows\System32\inetsrv\appcmd.exe" add site /name:"${{ env.IIS_SITE_NAME }}" /physicalPath:"${{ env.DEPLOY_PATH }}" /bindings:http/*:5095:
              "C:\Windows\System32\inetsrv\appcmd.exe" set site "${{ env.IIS_SITE_NAME }}" /[path='/'].applicationPool:"${{ env.IIS_APP_POOL }}"
              echo ✅ Website criado: ${{ env.IIS_SITE_NAME }}
          ) else (
              echo ✅ Website já existe: ${{ env.IIS_SITE_NAME }}
              "C:\Windows\System32\inetsrv\appcmd.exe" set site "${{ env.IIS_SITE_NAME }}" /physicalPath:"${{ env.DEPLOY_PATH }}"
          )

      - name: 🛑 Parar Application Pool no IIS
        shell: cmd
        run: |
          @echo off
          echo Parando App Pool...
          "C:\Windows\System32\inetsrv\appcmd.exe" stop apppool "${{ env.IIS_APP_POOL }}"
          echo ✅ App Pool parado
          timeout /t 3

      - name: 🗑️ Limpar diretório de deploy
        shell: powershell
        run: |
          $deployPath = "${{ env.DEPLOY_PATH }}"
          
          Write-Host "Limpando diretório de deploy: $deployPath"
          
          if (Test-Path $deployPath) {
              Get-ChildItem -Path $deployPath -Recurse -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "✅ Diretório limpo"
          }

      - name: 📤 Copiar arquivos para IIS
        shell: powershell
        run: |
          $source = ".\build-output"
          $destination = "${{ env.DEPLOY_PATH }}"
          
          Write-Host "Copiando arquivos para IIS..."
          
          if (Test-Path $source) {
              Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force -ErrorAction Stop
              Write-Host "✅ Arquivos copiados com sucesso"
              
              $fileCount = (Get-ChildItem $destination -Recurse | Measure-Object).Count
              Write-Host "Total de arquivos no deploy: $fileCount"
          } else {
              Write-Host "❌ Source não encontrado!"
              exit 1
          }

      - name: ✅ Iniciar Application Pool e Site no IIS
        shell: cmd
        run: |
          @echo off
          echo Iniciando App Pool...
          "C:\Windows\System32\inetsrv\appcmd.exe" start apppool "${{ env.IIS_APP_POOL }}"
          echo ✅ App Pool iniciado
          
          echo Iniciando Website...
          "C:\Windows\System32\inetsrv\appcmd.exe" start site "${{ env.IIS_SITE_NAME }}"
          echo ✅ Website iniciado
          
          timeout /t 5

      - name: 🔍 Verificar saúde da aplicação
        shell: powershell
        run: |
          $appUrl = "${{ env.APP_URL }}"
          $maxAttempts = 15
          $attempt = 0
          $success = $false
          
          Write-Host "Aguardando aplicação inicializar..."
          Write-Host "URL: $appUrl"
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $appUrl -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Aplicação respondendo corretamente!"
                $success = $true
                break
              }
            } catch {
              $attempt++
              $remainingAttempts = $maxAttempts - $attempt
              Write-Host "⏳ Tentativa $attempt/$maxAttempts - $remainingAttempts tentativas restantes..."
              Start-Sleep -Seconds 4
            }
          }
          
          if (-not $success) {
            Write-Host "❌ Aplicação não respondeu após $maxAttempts tentativas"
            exit 1
          }

      - name: 💬 Notificar sucesso
        if: success()
        shell: cmd
        run: |
          echo.
          echo ✅ Deploy realizado com sucesso!
          echo 🌐 Aplicação disponível em: ${{ env.APP_URL }}
          echo.

      - name: 💬 Notificar falha
        if: failure()
        shell: cmd
        run: |
          echo.
          echo ❌ Falha no deploy - Verifique os logs acima
          echo.
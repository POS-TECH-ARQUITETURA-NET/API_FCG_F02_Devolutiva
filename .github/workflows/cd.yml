name: CD - Entrega Contínua

on:
  workflow_run:
    workflows: ["CI - Integração Contínua"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

env:
  IIS_SITE_NAME: 'API_FCG_F01'
  IIS_APP_POOL: 'API_FCG_F01_AppPool'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\API_FCG_F01'
  APP_URL: 'http://localhost:5095/swagger'

jobs:
  deploy-to-iis:
    runs-on: [self-hosted, windows]
    name: Deploy no IIS

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Download do artefato de build
        uses: actions/download-artifact@v4
        with:
          name: api-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          path: ./build-output

      - name: 🔍 Verificar se artefato foi baixado
        shell: powershell
        run: |
          if (Test-Path ".\build-output") {
              Write-Host "✅ Artefato encontrado"
              Get-ChildItem ".\build-output" -Recurse | Select-Object -First 10
          } else {
              Write-Host "❌ Artefato NÃO encontrado!"
              exit 1
          }

      - name: 🔧 Criar diretório de deploy
        shell: powershell
        run: |
          $deployPath = "${{ env.DEPLOY_PATH }}"
          if (-not (Test-Path $deployPath)) {
              New-Item -ItemType Directory -Path $deployPath -Force | Out-Null
              Write-Host "✅ Diretório criado: $deployPath"
          } else {
              Write-Host "✅ Diretório já existe: $deployPath"
          }

      - name: 🔧 Garantir App Pool no IIS
        shell: powershell
        run: |
          $appPoolName = "${{ env.IIS_APP_POOL }}"
          $appcmd = "C:\Windows\System32\inetsrv\appcmd.exe"
          
          Write-Host "Verificando App Pool: $appPoolName"
          
          try {
              $result = & $appcmd list apppool $appPoolName 2>$null
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "✅ App Pool já existe: $appPoolName"
              } else {
                  Write-Host "Criando App Pool: $appPoolName"
                  & $appcmd add apppool /name:$appPoolName
                  Write-Host "✅ App Pool criado: $appPoolName"
              }
          } catch {
              Write-Host "⚠️  Erro ao verificar app pool: $_"
          }

      - name: 🔧 Garantir Site no IIS
        shell: powershell
        run: |
          $siteName = "${{ env.IIS_SITE_NAME }}"
          $appPoolName = "${{ env.IIS_APP_POOL }}"
          $deployPath = "${{ env.DEPLOY_PATH }}"
          $appcmd = "C:\Windows\System32\inetsrv\appcmd.exe"
          
          Write-Host "Verificando Website: $siteName"
          
          try {
              $result = & $appcmd list site $siteName 2>$null
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "✅ Website já existe: $siteName"
                  & $appcmd set site $siteName /physicalPath:$deployPath
              } else {
                  Write-Host "Criando Website: $siteName"
                  & $appcmd add site /name:$siteName /physicalPath:$deployPath /bindings:"http/*:5095:"
                  & $appcmd set site $siteName "/[path='/'].applicationPool:$appPoolName"
                  Write-Host "✅ Website criado: $siteName"
              }
          } catch {
              Write-Host "⚠️  Erro ao verificar website: $_"
          }

      - name: 🛑 Parar Application Pool no IIS
        shell: powershell
        run: |
          $appPoolName = "${{ env.IIS_APP_POOL }}"
          $appcmd = "C:\Windows\System32\inetsrv\appcmd.exe"
          
          Write-Host "Parando App Pool: $appPoolName"
          & $appcmd stop apppool $appPoolName 2>$null
          Write-Host "✅ App Pool parado"
          
          Start-Sleep -Seconds 3

      - name: 🗑️ Limpar diretório de deploy
        shell: powershell
        run: |
          $deployPath = "${{ env.DEPLOY_PATH }}"
          
          Write-Host "Limpando diretório de deploy: $deployPath"
          
          if (Test-Path $deployPath) {
              Get-ChildItem -Path $deployPath -Recurse -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "✅ Diretório limpo"
          }

      - name: 📤 Copiar arquivos para IIS
        shell: powershell
        run: |
          $source = ".\build-output"
          $destination = "${{ env.DEPLOY_PATH }}"
          
          Write-Host "Copiando arquivos para IIS..."
          Write-Host "Source: $source"
          Write-Host "Destination: $destination"
          
          if (Test-Path $source) {
              Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force -ErrorAction Stop
              Write-Host "✅ Arquivos copiados com sucesso"
              
              $fileCount = (Get-ChildItem $destination -Recurse | Measure-Object).Count
              Write-Host "Total de arquivos no deploy: $fileCount"
          } else {
              Write-Host "❌ Source não encontrado!"
              exit 1
          }

      - name: ✅ Iniciar Application Pool e Site no IIS
        shell: powershell
        run: |
          $appPoolName = "${{ env.IIS_APP_POOL }}"
          $siteName = "${{ env.IIS_SITE_NAME }}"
          $appcmd = "C:\Windows\System32\inetsrv\appcmd.exe"
          
          Write-Host "Iniciando App Pool: $appPoolName"
          & $appcmd start apppool $appPoolName 2>$null
          Write-Host "✅ App Pool iniciado"
          
          Write-Host "Iniciando Website: $siteName"
          & $appcmd start site $siteName 2>$null
          Write-Host "✅ Website iniciado"
          
          Start-Sleep -Seconds 5

      - name: 🔍 Verificar saúde da aplicação
        shell: powershell
        run: |
          $appUrl = "${{ env.APP_URL }}"
          $maxAttempts = 15
          $attempt = 0
          $success = $false
          
          Write-Host "Aguardando aplicação inicializar..."
          Write-Host "URL: $appUrl"
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $appUrl -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Aplicação respondendo corretamente!"
                $success = $true
                break
              }
            } catch {
              $attempt++
              $remainingAttempts = $maxAttempts - $attempt
              Write-Host "⏳ Tentativa $attempt/$maxAttempts - $remainingAttempts tentativas restantes..."
              Start-Sleep -Seconds 4
            }
          }
          
          if (-not $success) {
            Write-Host "❌ Aplicação não respondeu após $maxAttempts tentativas"
            Write-Host "Verificando status do App Pool..."
            $appcmd = "C:\Windows\System32\inetsrv\appcmd.exe"
            & $appcmd list apppool "${{ env.IIS_APP_POOL }}"
            exit 1
          }

      - name: 💬 Notificar sucesso
        if: success()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "✅ Deploy realizado com sucesso!"
          Write-Host "🌐 Aplicação disponível em: ${{ env.APP_URL }}"
          Write-Host ""

      - name: 💬 Notificar falha
        if: failure()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "❌ Falha no deploy - Verifique os logs acima"
          Write-Host ""
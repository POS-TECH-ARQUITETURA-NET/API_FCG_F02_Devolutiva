name: CD - Entrega Contínua

on:
  workflow_run:
    workflows: ["CI - Integração Contínua"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

env:
  IIS_SITE_NAME: 'API_FCG_F01'
  IIS_APP_POOL: 'API_FCG_F01_AppPool'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\API_FCG_F01'
  APP_URL: 'http://localhost:5095/swagger'

jobs:
  deploy-to-iis:
    runs-on: [self-hosted, windows]
    name: Deploy no IIS

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Download do artefato de build
        uses: actions/download-artifact@v4
        with:
          name: api-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          path: ./build-output

      - name: 🔍 Verificar se artefato foi baixado
        shell: powershell
        run: |
          if (Test-Path ".\build-output") {
              Write-Host "✅ Artefato encontrado"
              Get-ChildItem ".\build-output" -Recurse | Select-Object -First 10
          } else {
              Write-Host "❌ Artefato NÃO encontrado!"
              exit 1
          }

      - name: 🔧 Criar diretório de deploy
        shell: powershell
        run: |
          $deployPath = "${{ env.DEPLOY_PATH }}"
          if (-not (Test-Path $deployPath)) {
              New-Item -ItemType Directory -Path $deployPath -Force | Out-Null
              Write-Host "✅ Diretório criado: $deployPath"
          } else {
              Write-Host "✅ Diretório já existe: $deployPath"
          }

      - name: 🔧 Garantir App Pool no IIS
        shell: cmd
        run: |
          @echo off
          echo Verificando App Pool...
          "C:\Windows\System32\inetsrv\appcmd.exe" list apppool "${{ env.IIS_APP_POOL }}"
          if %ERRORLEVEL% neq 0 (
              echo Criando App Pool...
              "C:\Windows\System32\inetsrv\appcmd.exe" add apppool /name:"${{ env.IIS_APP_POOL }}"
              echo ✅ App Pool criado: ${{ env.IIS_APP_POOL }}
          ) else (
              echo ✅ App Pool já existe: ${{ env.IIS_APP_POOL }}
          )

      - name: 🔧 Garantir Site no IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $siteName = "${{ env.IIS_SITE_NAME }}"
          $appPoolName = "${{ env.IIS_APP_POOL }}"
          $deployPath = "${{ env.DEPLOY_PATH }}"

          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"

          Write-Host "Verificando Website: $siteName"

          # Verifica se o AppCmd existe
          if (-not (Test-Path $appcmd)) {
              throw "AppCmd.exe não encontrado!"
          }

          # Verifica se o diretório de publicação existe
          if (-not (Test-Path $deployPath)) {
              throw "Diretório de deploy não encontrado: $deployPath"
          }

          # Verifica se o Website já existe
          $null = & $appcmd list site $siteName 2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Host "Criando Website: $siteName"

              & $appcmd add site `
                "/name:$siteName" `
                "/physicalPath:$deployPath" `
                "/bindings:http/*:5095:"

              if ($LASTEXITCODE -ne 0) {
                  throw "Erro ao criar o Website no IIS."
              }

              Write-Host "Website criado com sucesso!"

          } else {

              Write-Host "Website já existe: $siteName"
          }

          # Configura o caminho físico do diretório virtual raiz
          Write-Host "Configurando caminho físico..."

          & $appcmd set vdir `
            "/vdir.name:$siteName/" `
            "/physicalPath:$deployPath"

          if ($LASTEXITCODE -ne 0) {
              throw "Erro ao configurar o caminho físico do Virtual Directory."
          }

          # Associa o Website ao Application Pool
          Write-Host "Associando Application Pool..."

          & $appcmd set app `
            "/app.name:$siteName/" `
            "/applicationPool:$appPoolName"

          if ($LASTEXITCODE -ne 0) {
              throw "Erro ao associar o Application Pool."
          }

          Write-Host "Website configurado com sucesso!"

          # Exibe as configurações finais
          Write-Host "Verificando configurações..."

          & $appcmd list site $siteName
          & $appcmd list vdirs "/app.name:$siteName/"
          & $appcmd list apps "/site.name:$siteName"

      - name: 🛑 Parar Application Pool no IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $appPoolName = "${{ env.IIS_APP_POOL }}"
          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"

          Write-Host "Verificando estado do App Pool: $appPoolName"

          if (-not (Test-Path $appcmd)) {
              throw "AppCmd.exe não encontrado!"
          }

          # Consulta o estado atual do Application Pool
          $appPoolInfo = & $appcmd list apppool $appPoolName

          if ($LASTEXITCODE -ne 0) {
              throw "Não foi possível consultar o Application Pool."
          }

          Write-Host $appPoolInfo

          # Verifica se está iniciado
          if ($appPoolInfo -match "state:Started") {

              Write-Host "App Pool está iniciado. Parando..."

              & $appcmd stop apppool $appPoolName

              if ($LASTEXITCODE -ne 0) {

                  # Confere se outra operação já conseguiu pará-lo
                  $appPoolInfo = & $appcmd list apppool $appPoolName

                  if ($LASTEXITCODE -ne 0 -or $appPoolInfo -notmatch "state:Stopped") {
                      throw "Erro ao parar o Application Pool."
                  }
              }

              Write-Host "✅ App Pool parado com sucesso!"

          }
          elseif ($appPoolInfo -match "state:Stopped") {

              Write-Host "✅ App Pool já está parado. Continuando o deploy..."

          }
          else {

              throw "Estado inesperado do Application Pool: $appPoolInfo"

          }

          # Aguarda a liberação dos arquivos
          Start-Sleep -Seconds 3

          Write-Host "✅ Etapa concluída!"

      - name: 🗑️ Limpar diretório de deploy
        shell: powershell
        run: |
          $deployPath = "${{ env.DEPLOY_PATH }}"
          
          Write-Host "Limpando diretório de deploy: $deployPath"
          
          if (Test-Path $deployPath) {
              Get-ChildItem -Path $deployPath -Recurse -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "✅ Diretório limpo"
          }

      - name: 📤 Copiar arquivos para IIS
        shell: powershell
        run: |
          $source = ".\build-output"
          $destination = "${{ env.DEPLOY_PATH }}"
          
          Write-Host "Copiando arquivos para IIS..."
          
          if (Test-Path $source) {
              Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force -ErrorAction Stop
              Write-Host "✅ Arquivos copiados com sucesso"
              
              $fileCount = (Get-ChildItem $destination -Recurse | Measure-Object).Count
              Write-Host "Total de arquivos no deploy: $fileCount"
          } else {
              Write-Host "❌ Source não encontrado!"
              exit 1
          }

      - name: ✅ Iniciar Application Pool e Site no IIS
        shell: cmd
        run: |
          @echo off

          echo Iniciando App Pool...

          "C:\Windows\System32\inetsrv\appcmd.exe" start apppool "${{ env.IIS_APP_POOL }}"

          if errorlevel 1 (
              echo ❌ Erro ao iniciar Application Pool!
              exit /b 1
          )

          echo ✅ App Pool iniciado

          echo Iniciando Website...

          "C:\Windows\System32\inetsrv\appcmd.exe" start site "${{ env.IIS_SITE_NAME }}"

          if errorlevel 1 (
              echo ❌ Erro ao iniciar Website!
              exit /b 1
          )

          echo ✅ Website iniciado

          powershell.exe -NoProfile -NonInteractive -Command "Start-Sleep -Seconds 5"

          if errorlevel 1 exit /b 1

      - name: 🔍 Verificar saúde da aplicação
        shell: powershell
        run: |
          $appUrl = "${{ env.APP_URL }}"
          $maxAttempts = 15
          $attempt = 0
          $success = $false
          
          Write-Host "Aguardando aplicação inicializar..."
          Write-Host "URL: $appUrl"
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $appUrl -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Aplicação respondendo corretamente!"
                $success = $true
                break
              }
            } catch {
              $attempt++
              $remainingAttempts = $maxAttempts - $attempt
              Write-Host "⏳ Tentativa $attempt/$maxAttempts - $remainingAttempts tentativas restantes..."
              Start-Sleep -Seconds 4
            }
          }
          
          if (-not $success) {
            Write-Host "❌ Aplicação não respondeu após $maxAttempts tentativas"
            exit 1
          }

      - name: 💬 Notificar sucesso
        if: success()
        shell: cmd
        run: |
          echo.
          echo ✅ Deploy realizado com sucesso!
          echo 🌐 Aplicação disponível em: ${{ env.APP_URL }}
          echo.

      - name: 💬 Notificar falha
        if: failure()
        shell: cmd
        run: |
          echo.
          echo ❌ Falha no deploy - Verifique os logs acima
          echo.
name: CD - Entrega Contínua

on:
  workflow_run:
    workflows: ["CI - Integração Contínua"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

env:
  IIS_SITE_NAME: 'API_FCG_F01'
  IIS_APP_POOL: 'API_FCG_F01_AppPool'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\API_FCG_F01'
  APP_URL: 'http://localhost:5095/swagger'

jobs:
  deploy-to-iis:
    runs-on: [self-hosted, windows]
    name: Deploy no IIS

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 🔓 Habilitar execução de scripts PowerShell
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          Write-Host "✅ Execution Policy definida como Bypass"

      - name: 📥 Download do artefato de build
        uses: actions/download-artifact@v4
        with:
          name: api-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          path: ./build-output

      - name: 🔍 Verificar se artefato foi baixado
        shell: powershell
        run: |
          if (Test-Path ".\build-output") {
              Write-Host "✅ Artefato encontrado"
              Get-ChildItem ".\build-output" | Write-Host
          } else {
              Write-Host "❌ Artefato NÃO encontrado!"
              exit 1
          }

      - name: 🔧 Garantir site e app pool no IIS
        shell: powershell
        run: |
          Write-Host "Iniciando configuração do IIS..."
          
          Import-Module WebAdministration -ErrorAction Stop
          
          if (-not (Test-Path "${{ env.DEPLOY_PATH }}")) {
              New-Item -ItemType Directory -Path "${{ env.DEPLOY_PATH }}" -Force | Out-Null
              Write-Host "✅ Diretório criado: ${{ env.DEPLOY_PATH }}"
          } else {
              Write-Host "✅ Diretório já existe: ${{ env.DEPLOY_PATH }}"
          }
          
          $appPoolPath = "IIS:\AppPools\${{ env.IIS_APP_POOL }}"
          if (-not (Test-Path $appPoolPath)) {
              New-WebAppPool -Name "${{ env.IIS_APP_POOL }}" -ErrorAction Stop
              Write-Host "✅ App Pool criado: ${{ env.IIS_APP_POOL }}"
          } else {
              Write-Host "✅ App Pool já existe: ${{ env.IIS_APP_POOL }}"
          }
          
          $site = Get-Website -Name "${{ env.IIS_SITE_NAME }}" -ErrorAction SilentlyContinue
          if (-not $site) {
              New-Website -Name "${{ env.IIS_SITE_NAME }}" `
                -PhysicalPath "${{ env.DEPLOY_PATH }}" `
                -ApplicationPool "${{ env.IIS_APP_POOL }}" `
                -Port 5095 `
                -Protocol http `
                -ErrorAction Stop | Out-Null
              Write-Host "✅ Website criado: ${{ env.IIS_SITE_NAME }}"
          } else {
              Write-Host "✅ Website já existe: ${{ env.IIS_SITE_NAME }}"
              Set-ItemProperty "IIS:\Sites\${{ env.IIS_SITE_NAME }}" -Name physicalPath -Value "${{ env.DEPLOY_PATH }}" -ErrorAction SilentlyContinue
          }

      - name: 🛑 Parar Application Pool no IIS
        shell: powershell
        run: |
          Write-Host "Parando App Pool..."
          Import-Module WebAdministration
          
          Stop-WebAppPool -Name "${{ env.IIS_APP_POOL }}" -ErrorAction SilentlyContinue
          Write-Host "✅ App Pool parado"
          Start-Sleep -Seconds 3

      - name: 🗑️ Limpar diretório de deploy
        shell: powershell
        run: |
          Write-Host "Limpando diretório de deploy..."
          
          Get-ChildItem -Path "${{ env.DEPLOY_PATH }}" -Recurse -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "✅ Diretório limpo"

      - name: 📤 Copiar arquivos para IIS
        shell: powershell
        run: |
          Write-Host "Copiando arquivos para IIS..."
          Copy-Item -Path ".\build-output\*" -Destination "${{ env.DEPLOY_PATH }}" -Recurse -Force -ErrorAction Stop
          Write-Host "✅ Arquivos copiados com sucesso"

      - name: ✅ Iniciar site e app pool
        shell: powershell
        run: |
          Write-Host "Iniciando App Pool e Website..."
          Import-Module WebAdministration
          
          Start-WebAppPool -Name "${{ env.IIS_APP_POOL }}" -ErrorAction SilentlyContinue
          Write-Host "✅ App Pool iniciado"
          
          Start-Website -Name "${{ env.IIS_SITE_NAME }}" -ErrorAction SilentlyContinue
          Write-Host "✅ Website iniciado"
          
          Start-Sleep -Seconds 5

      - name: 🔍 Verificar saúde da aplicação
        shell: powershell
        run: |
          $maxAttempts = 12
          $attempt = 0
          $success = $false
          
          Write-Host "Aguardando aplicação inicializar..."
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri "${{ env.APP_URL }}" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Aplicação respondendo corretamente!"
                $success = $true
                break
              }
            } catch {
              $attempt++
              Write-Host "⏳ Tentativa $attempt/$maxAttempts - Aguardando 5 segundos..."
              Start-Sleep -Seconds 5
            }
          }
          
          if (-not $success) {
            Write-Host "❌ Aplicação não respondeu após $maxAttempts tentativas"
            exit 1
          }

      - name: 💬 Notificar sucesso
        if: success()
        shell: powershell
        run: |
          Write-Host "✅ Deploy realizado com sucesso!"
          Write-Host "🌐 Aplicação disponível em: ${{ env.APP_URL }}"

      - name: 💬 Notificar falha
        if: failure()
        shell: powershell
        run: |
          Write-Host "❌ Falha no deploy"
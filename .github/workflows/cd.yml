name: CD - Entrega Contínua

on:
  workflow_run:
    workflows: ["CI - Integração Contínua"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

env:
  IIS_SITE_NAME: 'API_FCG_F01'
  IIS_APP_POOL: 'API_FCG_F01_AppPool'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\API_FCG_F01'
  APP_URL: 'http://localhost:5095/swagger'
  APPCMD: 'C:\Windows\System32\inetsrv\appcmd.exe'

jobs:
  deploy-to-iis:
    runs-on: [self-hosted, windows]
    name: Deploy no IIS

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Download do artefato de build
        uses: actions/download-artifact@v4
        with:
          name: api-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          path: ./build-output

      - name: 🔍 Verificar se artefato foi baixado
        shell: cmd
        run: |
          if exist ".\build-output" (
              echo ✅ Artefato encontrado
              dir ".\build-output"
          ) else (
              echo ❌ Artefato NÃO encontrado!
              exit /b 1
          )

      - name: 🔧 Criar diretório de deploy
        shell: cmd
        run: |
          if not exist "${{ env.DEPLOY_PATH }}" (
              mkdir "${{ env.DEPLOY_PATH }}"
              echo ✅ Diretório criado: ${{ env.DEPLOY_PATH }}
          ) else (
              echo ✅ Diretório já existe: ${{ env.DEPLOY_PATH }}
          )

      - name: 🔧 Garantir App Pool no IIS
        shell: cmd
        run: |
          echo Verificando App Pool...
          "${{ env.APPCMD }}" list apppool "${{ env.IIS_APP_POOL }}" >nul 2>&1
          if %ERRORLEVEL% neq 0 (
              echo Criando App Pool...
              "${{ env.APPCMD }}" add apppool /name:"${{ env.IIS_APP_POOL }}"
              echo ✅ App Pool criado: ${{ env.IIS_APP_POOL }}
          ) else (
              echo ✅ App Pool já existe: ${{ env.IIS_APP_POOL }}
          )

      - name: 🔧 Garantir Site no IIS
        shell: cmd
        run: |
          echo Verificando Website...
          "${{ env.APPCMD }}" list site "${{ env.IIS_SITE_NAME }}" >nul 2>&1
          if %ERRORLEVEL% neq 0 (
              echo Criando Website...
              "${{ env.APPCMD }}" add site /name:"${{ env.IIS_SITE_NAME }}" /physicalPath:"${{ env.DEPLOY_PATH }}" /bindings:http/*:5095:
              "${{ env.APPCMD }}" set site "${{ env.IIS_SITE_NAME }}" /[path='/'].applicationPool:"${{ env.IIS_APP_POOL }}"
              echo ✅ Website criado: ${{ env.IIS_SITE_NAME }}
          ) else (
              echo ✅ Website já existe: ${{ env.IIS_SITE_NAME }}
              "${{ env.APPCMD }}" set site "${{ env.IIS_SITE_NAME }}" /physicalPath:"${{ env.DEPLOY_PATH }}"
          )

      - name: 🛑 Parar Application Pool no IIS
        shell: cmd
        run: |
          echo Parando App Pool...
          "${{ env.APPCMD }}" stop apppool "${{ env.IIS_APP_POOL }}"
          echo ✅ App Pool parado
          timeout /t 3

      - name: 🗑️ Limpar diretório de deploy
        shell: cmd
        run: |
          echo Limpando diretório de deploy...
          if exist "${{ env.DEPLOY_PATH }}" (
              for /d %%x in ("${{ env.DEPLOY_PATH }}\*") do @rd /s /q "%%x"
              for %%x in ("${{ env.DEPLOY_PATH }}\*") do @del /q "%%x"
              echo ✅ Diretório limpo
          )

      - name: 📤 Copiar arquivos para IIS
        shell: cmd
        run: |
          echo Copiando arquivos para IIS...
          xcopy ".\build-output\*" "${{ env.DEPLOY_PATH }}" /E /Y /I
          if %ERRORLEVEL% equ 0 (
              echo ✅ Arquivos copiados com sucesso
          ) else (
              echo ❌ Erro ao copiar arquivos
              exit /b 1
          )

      - name: ✅ Iniciar Application Pool e Site no IIS
        shell: cmd
        run: |
          echo Iniciando App Pool...
          "${{ env.APPCMD }}" start apppool "${{ env.IIS_APP_POOL }}"
          echo ✅ App Pool iniciado
          
          echo Iniciando Website...
          "${{ env.APPCMD }}" start site "${{ env.IIS_SITE_NAME }}"
          echo ✅ Website iniciado
          
          timeout /t 5

      - name: 🔍 Verificar saúde da aplicação
        shell: pwsh
        run: |
          $maxAttempts = 12
          $attempt = 0
          $success = $false
          
          Write-Host "Aguardando aplicação inicializar..."
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri "${{ env.APP_URL }}" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Aplicação respondendo corretamente!"
                $success = $true
                break
              }
            } catch {
              $attempt++
              Write-Host "⏳ Tentativa $attempt/$maxAttempts - Aguardando 5 segundos..."
              Start-Sleep -Seconds 5
            }
          }
          
          if (-not $success) {
            Write-Host "❌ Aplicação não respondeu após $maxAttempts tentativas"
            exit 1
          }

      - name: 💬 Notificar sucesso
        if: success()
        shell: cmd
        run: |
          echo.
          echo ✅ Deploy realizado com sucesso!
          echo 🌐 Aplicação disponível em: ${{ env.APP_URL }}
          echo.

      - name: 💬 Notificar falha
        if: failure()
        shell: cmd
        run: |
          echo.
          echo ❌ Falha no deploy - Verifique os logs acima
          echo.
name: CD - Entrega Contínua

on:
  workflow_run:
    workflows: ["CI - Integração Contínua"]
    types:
      - completed
    branches: [ main ]

env:
  IIS_SITE_NAME: 'API_FCG_F01'
  IIS_APP_POOL: 'API_FCG_F01_AppPool'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\API_FCG_F01'

jobs:
  deploy-to-iis:
    runs-on: [self-hosted, windows]
    name: Deploy no IIS

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: 📥 Download do artefato de build
      uses: actions/download-artifact@v4
      with:
        name: api-build
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        path: ./build-output

    - name: 🛑 Parar Application Pool no IIS
      run: |
        # Para o application pool
        Import-Module WebAdministration
        Stop-WebAppPool -Name "${{ env.IIS_APP_POOL }}" -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 3
      shell: powershell

    - name: 🗑️ Limpar diretório de deploy
      run: |
        if (Test-Path "${{ env.DEPLOY_PATH }}") {
          Remove-Item "${{ env.DEPLOY_PATH }}\*" -Recurse -Force
        }
      shell: powershell

    - name: 📤 Copiar arquivos para IIS
      run: |
        Copy-Item -Path ".\build-output\*" -Destination "${{ env.DEPLOY_PATH }}" -Recurse -Force
      shell: powershell

    - name: ✅ Iniciar Application Pool no IIS
      run: |
        # Inicia o application pool
        Import-Module WebAdministration
        Start-WebAppPool -Name "${{ env.IIS_APP_POOL }}" -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 5
      shell: powershell

    - name: 🔍 Verificar saúde da aplicação
      run: |
        $maxAttempts = 5
        $attempt = 0

        while ($attempt -lt $maxAttempts) {
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:5095/swagger" -UseBasicParsing -TimeoutSec 5
            if ($response.StatusCode -eq 200) {
              Write-Host "✅ Aplicação está respondendo corretamente!"
              exit 0
            }
          } catch {
            $attempt++
            if ($attempt -lt $maxAttempts) {
              Write-Host "⏳ Tentativa $attempt/$maxAttempts falhada. Aguardando..."
              Start-Sleep -Seconds 5
            }
          }
        }

        Write-Host "❌ Falha ao verificar saúde da aplicação após $maxAttempts tentativas"
        exit 1
      shell: powershell

    - name: 💬 Notificar sucesso
      if: success()
      run: |
        Write-Host "✅ Deploy realizado com sucesso!"
        Write-Host "🌐 Aplicação disponível em: http://localhost:5095"

    - name: 💬 Notificar falha
      if: failure()
      run: |
        Write-Host "❌ Falha no deploy. Verifique os logs do IIS."
      shell: powershell
